<!DOCTYPE html>
<!--
  Fixture for the MOBILE RULE-ROW SQUEEZE guard
  (playwright.rule-row-squeeze.config.ts).

  Reproduces the ROW LAYOUT of `RuleRow` in
  features/masterwork/components/detail/RulebookDetailPage.tsx at the exact
  breakpoint the defect was pinned at (390px, dark) — real Tailwind classes,
  compiled by the project's own `app/globals.css` + `@tailwindcss/postcss`
  (build-css.mjs), not a jsdom approximation. Two rows, both carrying the SAME
  content and the SAME action-button set (the ownership vocabulary's five
  verbs, the worst case): #buggyRow with the row's PRE-FIX classes, #fixedRow
  with its CURRENT classes. The spec asserts the buggy row's provenance
  element is tall (many wrapped lines — the reported one-char-per-line defect)
  and the fixed row's is short (at most a couple of lines), so the guard is
  proven failing against the old shape and passing against the new one in the
  same run, no git gymnastics required.

  Class strings below are copied verbatim from the component; keep them in
  sync by hand if the component's classes change (see the header of the
  spec file for the exact line references).
-->
<html class="dark">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="./compiled.css" />
  <style>
    body { background: #09090b; margin: 0; padding: 0; }
    .card { border: 1px solid #27272a; border-radius: 0.375rem; background: #18181b; margin: 8px; }
    button { font: inherit; color: inherit; background: transparent; border: 1px solid #3f3f46; border-radius: 0.375rem; }
  </style>
</head>
<body>
  <!-- BUGGY: the row's classes as they were before this fix (2026-09-19 defect). -->
  <div id="buggyRow" class="card">
    <div class="flex w-full items-start gap-2 px-3 py-2">
      <label class="mt-1 inline-flex shrink-0">
        <input type="checkbox" class="h-4 w-4 shrink-0" />
      </label>
      <button type="button" class="flex min-w-0 flex-1 items-start gap-2 text-left">
        <span class="mt-0.5 h-4 w-4 shrink-0">&gt;</span>
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-sm font-medium text-foreground">Require Printed Ticket</span>
            <span class="rounded border px-1.5 py-0 text-[10px]">Critical</span>
          </div>
          <p class="mt-0.5 text-sm text-muted-foreground">
            Do not accept a load at the gate unless a weigh ticket has been printed before the truck moves.
          </p>
          <span id="buggyProvenance" class="inline-flex min-w-0 items-baseline gap-1 text-xs text-muted-foreground">
            <span class="h-3 w-3 shrink-0">"</span>
            <span class="shrink-0">Chapter 1. Accepting a Load at the Gate &middot; at 0:02&ndash;0:08</span>
          </span>
        </div>
      </button>
      <div class="shrink-0 flex-nowrap gap-1 flex items-center">
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Mine</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Mine but wrong</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Improve</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Not mine</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Edit</button>
      </div>
    </div>
  </div>

  <!-- FIXED: the row's CURRENT classes (RulebookDetailPage.tsx, RuleRow). -->
  <div id="fixedRow" class="card">
    <div class="flex w-full flex-wrap items-start gap-2 px-3 py-2">
      <label class="mt-1 inline-flex shrink-0">
        <input type="checkbox" class="h-4 w-4 shrink-0" />
      </label>
      <button type="button" class="flex min-w-0 flex-1 items-start gap-2 text-left">
        <span class="mt-0.5 h-4 w-4 shrink-0">&gt;</span>
        <div class="min-w-0 flex-1">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-sm font-medium text-foreground">Require Printed Ticket</span>
            <span class="rounded border px-1.5 py-0 text-[10px]">Critical</span>
          </div>
          <p class="mt-0.5 text-sm text-muted-foreground">
            Do not accept a load at the gate unless a weigh ticket has been printed before the truck moves.
          </p>
          <span id="fixedProvenance" class="inline-flex min-w-0 items-baseline gap-1 text-xs text-muted-foreground">
            <span class="h-3 w-3 shrink-0">"</span>
            <span class="shrink-0">Chapter 1. Accepting a Load at the Gate &middot; at 0:02&ndash;0:08</span>
          </span>
        </div>
      </button>
      <div class="w-full shrink-0 flex-wrap justify-end gap-1 sm:w-auto sm:flex-nowrap sm:justify-start flex items-center">
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Mine</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Mine but wrong</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Improve</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Not mine</button>
        <button class="h-7 px-3 inline-flex items-center gap-1.5 whitespace-nowrap text-sm">Edit</button>
      </div>
    </div>
  </div>
</body>
</html>
