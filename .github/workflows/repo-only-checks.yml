name: Repo-only checks

# The code-only leg of "checks run in the app" (common-docs/projects/checks-run-in-the-app/PLAN.md,
# decision 4): the release-check rows DECLARED repo-only in scripts/checks/row-classes.json run here
# on the head of main, and the runner's --json output is uploaded as the artifact `checks-findings`.
# The app (aidream `platform_checks_ci_pull` system task) pulls the newest successful artifact
# through the GitHub API and feeds it to the one ingest (ops.check_run / ops.check_item).
#
# 🚨 SCHEDULE APPROVED by Arman, 2026-09-26 (in chat): hourly at :05 UTC — exact name and interval
# in common-docs/operations/scheduled-tasks.md. Change the cron only with his word and update that
# register row in the same change. The app's pull (`platform_checks_ci_pull`) runs at :40, after
# both repos' runs of the same hour have finished. A hand run is still available:
#   gh workflow run repo-only-checks.yml --ref main
#
# 🚨 THIS REPOSITORY IS PUBLIC. Nothing here may read a database or need a secret: `--repo-only`
# runs ONLY rows declared repo-only (clone-db, live-db and undeclared rows are left out and named in
# the header's `skipped_not_repo_only`). No `secrets.*` is referenced in this file — keep it so.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

# Its own group, never cancelled: a push to main never touches this run (CI's group is separate),
# and a second dispatch waits for the first instead of killing it.
concurrency:
  group: repo-only-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: repo-only checks (head of main)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Full history and tags: self-tests replay a guard's pre-fix copy from git
      # (check:self-tests-stay-out-of-tree reads `<sha>^`), and the patrol delivery check
      # needs a version tag. A depth-1 checkout made both report failure without judging
      # (2026-09-30, common-docs/projects/checks-run-in-the-app/COORDINATOR.md § Broken checks).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # matrx-local is PUBLIC, so it is cloned beside this repo with no secret: the honest-state
      # parity guard and its self-test read the engine artifact there and were UNMEASURED without it.
      # aidream is private and cannot be reached from this public workflow — the rows that read it
      # say UNMEASURED and the page shows them as broken with that reason.
      - name: Clone matrx-local's contracts beside this repo (public, no secret)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/armanisadeghi/matrx-local.git ../matrx-local
          git -C ../matrx-local sparse-checkout set crates/matrx-sync/contracts
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The shell-layout gate measures shipped CSS in a real browser; without Chromium it
      # printed "UNMEASURED: … could not launch Chromium" on every run.
      - name: Install Chromium for the real-browser rows
        run: pnpm exec playwright install --with-deps chromium
      # The full type-check alone peaks near 13 GB; with it running, this 16 GB runner measured
      # 15.5 GB used and 500 MB available (runs 36670255447, 36671478127). 8 GB of swap turns the
      # next spike into a slower row instead of a runner shut down mid-run (36653040837).
      - name: Add 8 GB of swap
        run: |
          sudo fallocate -l 8G /matrx-swap && sudo chmod 600 /matrx-swap
          sudo mkswap /matrx-swap >/dev/null && sudo swapon /matrx-swap
          free -m
      - name: Run every repo-only row (items on)
        env:
          MATRX_ITEMS: "1"
        # Memory every 20 s into tmp/checks/memory.log (uploaded with checks-logs): run 36653040837
        # was shut down mid-run (exit 143) and nothing recorded why. The runner now also bounds
        # its worker pool by this machine's cores and memory (scripts/checks/run.mjs defaultWorkers).
        run: |
          mkdir -p tmp/checks
          ( while sleep 20; do echo "$(date -u +%T) $(free -m | awk '/^Mem:/{m="used_mb="$3" available_mb="$7} /^Swap:/{s=" swap_used_mb="$3} END{print m s}')"; done ) > tmp/checks/memory.log 2>&1 &
          node scripts/checks/run.mjs --repo-only --json tmp/checks/findings.jsonl
      - name: Upload the findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-findings
          path: tmp/checks/findings.jsonl
          if-no-files-found: error
          retention-days: 7
      # Every row's full log, beside the findings. A finding's `detail` names
      # tmp/checks/<row>.log; without this a CI-only failure cannot be read.
      - name: Upload every row's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs
          path: tmp/checks/*.log
          if-no-files-found: warn
          retention-days: 7
