name: Repo-only checks

# The code-only leg of "checks run in the app" (common-docs/projects/checks-run-in-the-app/PLAN.md,
# decision 4): the release-check rows DECLARED repo-only in scripts/checks/row-classes.json run here
# on the head of main, and the runner's --json output is uploaded as the artifact `checks-findings`.
# The app (aidream `platform_checks_ci_pull` system task) pulls the newest successful artifact
# through the GitHub API and feeds it to the one ingest (ops.check_run / ops.check_item).
#
# 🚨 SCHEDULE APPROVED by Arman, 2026-09-26 (in chat): hourly at :05 UTC — exact name and interval
# in common-docs/operations/scheduled-tasks.md. Change the cron only with his word and update that
# register row in the same change. The app's pull (`platform_checks_ci_pull`) runs at :40, after
# both repos' runs of the same hour have finished. A hand run is still available:
#   gh workflow run repo-only-checks.yml --ref main
#
# 🚨 THIS REPOSITORY IS PUBLIC. Nothing here may read a database or need a secret: `--repo-only`
# runs ONLY rows declared repo-only (clone-db, live-db and undeclared rows are left out and named in
# the header's `skipped_not_repo_only`). No `secrets.*` is referenced in this file — keep it so.
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:

# Its own group, never cancelled: a push to main never touches this run (CI's group is separate),
# and a second dispatch waits for the first instead of killing it.
concurrency:
  group: repo-only-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: repo-only checks (head of main)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run every repo-only row (items on)
        env:
          MATRX_ITEMS: "1"
        # Memory every 20 s into tmp/checks/memory.log (uploaded with checks-logs): run 36653040837
        # was shut down mid-run (exit 143) and nothing recorded why. The runner now also bounds
        # its worker pool by this machine's cores and memory (scripts/checks/run.mjs defaultWorkers).
        run: |
          mkdir -p tmp/checks
          ( while sleep 20; do echo "$(date -u +%T) $(free -m | awk '/^Mem:/{print "used_mb="$3" available_mb="$7}')"; done ) > tmp/checks/memory.log 2>&1 &
          node scripts/checks/run.mjs --repo-only --json tmp/checks/findings.jsonl
      - name: Upload the findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-findings
          path: tmp/checks/findings.jsonl
          if-no-files-found: error
          retention-days: 7
      # Every row's full log, beside the findings. A finding's `detail` names
      # tmp/checks/<row>.log; without this a CI-only failure cannot be read.
      - name: Upload every row's log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-logs
          path: tmp/checks/*.log
          if-no-files-found: warn
          retention-days: 7
