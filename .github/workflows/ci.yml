name: CI

# Per-PR checks. Until this file existed, every gate in this repo lived inside
# `scripts/run-release-gates.sh` — which runs at RELEASE time, by hand. A
# regression to the `__kind` marker law, the type surface, or the content-IR /
# workflow-runtime contracts could therefore sit on `main` undetected until
# somebody happened to cut a release. This closes that window.
#
# SCOPE, deliberately: this is NOT the release gate. It runs the few checks
# that must never regress silently and that are cheap enough to run on every
# push. The full gate (migrations, schema drift, access matrices, the ~40 other
# `check:*` scripts) stays where it belongs — in `run-release-gates.sh`, owned
# by `./ship.sh`. Adding a slow check here trains people to ignore a red X.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# CONCURRENCY — why this is `false` and must stay `false`.
#
# It was `cancel-in-progress: true` until 2026-09-11. Measured that day with
# `gh run list --workflow=CI --limit 200`: ZERO successful runs, ever — 25
# failed, 15 cancelled, the rest cancelled-before-start. Commits land on main
# every 3–5 minutes and a full run takes ~10–13 minutes, so every push shot the
# previous run in the head. CI therefore never produced a verdict about
# anything, and four genuinely red jobs sat unnoticed for weeks behind the
# noise. A gate that never finishes is not a slow gate; it is no gate.
#
# THE DESIGN: a started run ALWAYS finishes, and the newest commit is ALWAYS
# the one that gets tested next. `cancel-in-progress: false` gives exactly
# that, because of GitHub's documented queue rule — when a run is queued behind
# an in-progress run in the same concurrency group, any *previously pending*
# run in that group is cancelled. So at most one run is in flight and at most
# one is waiting, and the one waiting is always the newest commit. Stale
# middle commits are dropped before they ever start a runner.
#
# THE TRADE-OFF, stated plainly: runs serialise per branch, so not every commit
# gets its own verdict and feedback on a busy main can lag by up to one run
# (~13 min). We take that deliberately over the alternative: a per-commit
# verdict that is cancelled 90% of the time is not a verdict. `main` is always
# verified at its tip, and every finished run is a real result.
#
# `cancel-in-progress: true` here is a regression. Do not restore it.
# ---------------------------------------------------------------------------
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # secrets-preflight — the ONE place that answers "which gates can actually be
  # measured on this run?", so no other job has to guess.
  #
  # Why it exists (2026-09-11): the credential-gated jobs below used to hard-
  # fail (`exit 2`) when their secret was absent. The intent was right — an
  # unmeasured gate must never read as a pass — but the effect was a job that is
  # red on 100% of runs for a reason no code change can fix. `realtime-
  # publication` had been red since it was written, because its cross-repo
  # checkout of AI-Matrix-Engine/aidream can never work with the default
  # GITHUB_TOKEN (that token is scoped to armanisadeghi/ai-matrx; the API
  # answers `Not Found`). A permanently-red job is exactly as useless as a
  # falsely-green one: it trains everyone to ignore the X, and it hid four REAL
  # failures for weeks.
  #
  # THE RESOLUTION, and it does not weaken THE STRICTNESS LAW clause 7: a gate
  # that cannot reach its dependency still never reports success. It reports
  # SKIPPED — grey, plainly not-run — and this job stamps a loud `UNMEASURED:`
  # warning annotation on the run summary naming the missing secret, the gates
  # it disabled, and what may now be regressing unnoticed. Skipped is not a
  # "warning that reads as a pass"; it is the honest third state the law's
  # clause 7 was reaching for. What is forbidden is a GREEN tick over an
  # unmeasured claim, and nothing here produces one.
  #
  # When the secret is present the gate runs for real and blocks for real.
  # ---------------------------------------------------------------------------
  secrets-preflight:
    name: which gates can be measured
    runs-on: ubuntu-latest
    outputs:
      supabase: ${{ steps.probe.outputs.supabase }}
      aidream_repo: ${{ steps.probe.outputs.aidream_repo }}
    steps:
      - name: Probe the credentials the live gates depend on
        id: probe
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          AIDREAM_REPO_TOKEN: ${{ secrets.AIDREAM_REPO_TOKEN }}
        run: |
          if [ -n "$SUPABASE_SECRET_KEY" ] && [ -n "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "supabase=true" >> "$GITHUB_OUTPUT"
            echo "measured: the live Supabase gates (kind registry freshness, hr.punch write path, migration slot guard, soft-delete cascade, realtime publication)"
          else
            echo "supabase=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=UNMEASURED — the live Supabase gates did NOT run::NEXT_PUBLIC_SUPABASE_URL and/or SUPABASE_SECRET_KEY are not configured for this repository, so four gates are SKIPPED, not passed: generated kind types may be stale against content_ir.kind_definition; a client-direct insert path into hr.punch may exist unnoticed; the BEFORE INSERT trigger on public._schema_migrations may be dropped or disabled; and soft-deleting a parent may again leave its bindings, treatments, exemplars and notes alive underneath it. Nothing was checked — that is NOT a pass. Fix: add the NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SECRET_KEY repository secrets."
          fi
          if [ -n "$AIDREAM_REPO_TOKEN" ]; then
            echo "aidream_repo=true" >> "$GITHUB_OUTPUT"
            echo "measured: the cross-repo realtime-publication census (aidream half reachable)"
          else
            echo "aidream_repo=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=UNMEASURED — the realtime publication census did NOT run::AIDREAM_REPO_TOKEN is not configured for this repository. That census has to read aidream/apps/shared, which lives in a DIFFERENT GitHub org (AI-Matrix-Engine/aidream) that this workflow's default GITHUB_TOKEN cannot see, so the checkout returns 'Not Found' and the job is SKIPPED, not passed. A postgres_changes subscription may again be joined to a table that publishes nothing — silent, error-free, and permanent. Fix: add a repository secret named AIDREAM_REPO_TOKEN holding a fine-grained personal access token with Contents:Read on AI-Matrix-Engine/aidream (a classic PAT with the 'repo' scope also works)."
          fi
  # ---------------------------------------------------------------------------
  # marker-law — the cheapest and most load-bearing gate in the repo. `__kind`
  # is part of the data (KINDS_EVERYWHERE_PLAN §4.2); stripping it outside the
  # three lawful doors is what made the workflow engine validate against shapes
  # its own renderers could not identify. Pure static scan, ~1s, and it needs
  # nothing installed beyond tsx — so it gets its own job and reports first.
  # aidream runs the same law as its own step in `.github/workflows/test.yml`;
  # a kind crosses both repos, so both halves must be guarded.
  # ---------------------------------------------------------------------------
  marker-law:
    name: the __kind marker law
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Measured production build-cache contract
        run: node --test scripts/build-lab/config-contract.test.mjs
      - name: Matrx-owned packages are declared and installed at npm latest
        run: pnpm check:matrx-packages
      - name: EVERY TYPESCRIPT FILE PARSES
        # ~4s over 14,716 files, zero backlog, and the only finding in this
        # repo that is not an opinion. On 2026-09-07 the census-H1 codemod
        # injected its new `@ai-matrx/kit/format` import INSIDE seven
        # multi-line `import {` statements (repaired in fc9a28a26f); the shared
        # dev server answered 500 on every route, for every agent working out
        # of the checkout, until someone traced it by hand. `pnpm type-check`
        # sees the same TS1003/1005/1128 — but it takes minutes, carries a
        # large tracked backlog, is advisory by standing ruling (D64/D65), and
        # nothing ran it between the codemod and the push. This is the guard
        # that runs. `pnpm check:parse --fix` repairs the injected-import
        # class; `pnpm check:parse:self-test` proves it can still fail.
        run: pnpm check:parse
      - name: the parse guard can still fail (self-test)
        # A guard you cannot demonstrate failing is not a guard. This plants
        # the exact 2026-09-07 shape and asserts the detector reports it, that
        # --fix repairs it, and that the repair is idempotent.
        run: pnpm check:parse:self-test
      - name: THE `__kind` MARKER LAW — no stripping outside the lawful doors
        run: pnpm check:kind-marker-law
      - name: THERE IS ONE AGENT PICKER — no re-grown agent/model selector
        # `@ai-matrx/agents/catalog/react` owns agent choice in every Matrx
        # client (ruling D1, 2026-09-08); ModelListDropdown owns model choice.
        # This gate ran ONLY in `run-release-gates.sh` — by hand, at release
        # time — so a fork could sit on main for weeks. Pure static scan over
        # tracked .ts/.tsx, ~2s.
        run: pnpm check:canonical-pickers
      - name: the picker guard can still fail (self-test)
        # A guard you cannot demonstrate failing is not a guard. Until
        # 2026-09-08 this script's patterns required a character BEFORE
        # "Agent", so a component named exactly `AgentPicker` — what
        # matrx-local shipped for months — walked straight through it. The
        # self-test plants that exact shape and asserts it is reported.
        run: pnpm check:canonical-pickers:self-test
      - name: THE ARCHIVED-ITEMS LAW — every list has an archive control
        # Arman, 2026-09-09: "everything should have an archive filter, and the
        # default should always hide archived, but seeing archived items should
        # be one or two clicks away." A hardcoded `.eq("is_archived", false)`
        # on a list read is zero clicks — the rows are unreachable forever.
        # The archivable-entity set is derived from types/database.types.ts, so
        # a new table with an archive column is covered the day db-types runs.
        # Pure static scan over tracked .ts/.tsx.
        run: pnpm check:archived-items-law
      - name: the archive guard can still fail (self-test)
        # A guard you cannot demonstrate failing is not a guard. The self-test
        # plants the exact shape `/agents/templates` shipped, a component that
        # renders the archive column with no control, and a file whose only
        # "control" is a comment — and asserts all three are reported, while a
        # service layer, a single-record read and a reasoned exemption are not.
        run: pnpm check:archived-items-law:self-test
      - name: NO HAND-TYPED MANDATE KEYS — the vocabulary is the authority
        # @ai-matrx/agents 0.10.0 publishes the declared mandate key set,
        # emitted by THE ONE GENERATOR from aidream's own declared_mandates().
        # A hand-typed literal is a mirror of that set: a typo, a rename or a
        # retirement on the server becomes a 404 nobody sees, and the release
        # report cannot resolve this repo's references against the key set it
        # shipped. Adopted 2026-09-10 (200 literals across 76 files -> 0), so
        # there is no baseline and any finding is NEW. Pure static scan over
        # tracked .ts/.tsx.
        run: pnpm check:mandate-keys
      - name: the mandate-key guard can still fail (self-test)
        # A guard you cannot demonstrate failing is not a guard. The self-test
        # plants a hand-typed key in each position the guard claims to cover —
        # constant, property, record value, JSX attribute, entry-point argument
        # — and asserts each is reported, while the MANDATE_KEYS member, an
        # identically-spelled entitlement meter id (the namespaces overlap) and
        # a mandate-named holder carrying a label or a UUID are not.
        run: pnpm check:mandate-keys:self-test
      - name: THE RENDER MATRIX — every recognition path x every shape archetype
        # The witness for the 2026-08-28 outage, in which one gate in one
        # package cost ~221 live kinds their component while every unit test
        # passed and every readiness check stayed green. It asserts the single
        # invariant the system exists to provide: a valid payload of a
        # registered kind that HAS a component reaches that component, on every
        # path, for every shape of data.
        #
        # Named separately from the content-ir suite so a failure shows ITS
        # message — which names the archetype, the path, and what the route
        # actually returned — instead of one red line among 1300 passing tests.
        run: pnpm test:render-matrix
      - name: ONE SOURCE OF TRUTH for a kind's fields — derived from its schema
        # `emitted_json_schema` IS the contract; `kind_definition.data` is a
        # copy that had already drifted on 13 of the 62 live kinds carrying
        # both, and was ABSENT on 440 of 502 — which is how ~221 kinds with
        # real components spent 2026-08-29 rendering as key/value dumps.
        run: pnpm check:kind-schema-source
      - name: THE ONE-TYPE LAW — no hand-written twin of a registered kind
        # A kind's shape is written down ONCE, in the generated artifact
        # (`pnpm shape:types`). A hand-written interface beside a bridge or a
        # renderer is a second source of truth that drifts silently and shows
        # up as a blank field on a user's screen, never as a compile error.
        # Offline: it reads the committed artifact, not the registry — the
        # registry-freshness half runs in the `kind-registry` job below, which
        # needs credentials. KINDS_EVERYWHERE_PLAN §10g GAP 1.
        run: pnpm check:kind-type-twins
      - name: THE KIND DIRECTIVES SHIM stays contained
        # `directives/legacyShell.ts` translates stored 4-key ```matrx fences so
        # old conversations keep rendering. It is the campaign's ONE legacy
        # surface and it has exactly one importer. The moment a second module
        # imports it, "translate what we stored" quietly becomes "accept the old
        # shape anywhere" and the retired shell is a live protocol again.
        # PLAN.md § THE STRICTNESS LAW clause 4.
        run: pnpm check:legacy-shim-containment
      - name: CLAUDE.md's machine-checkable claims still hold
        # Includes the claim that THIS workflow runs the gates named in it.
        # Without it here, deleting a step from this file would silently make
        # CLAUDE.md promise a gate that no longer runs — and an agent that
        # trusts the promise skips its own verification.
        run: pnpm check:doc-claims --strict

  # ---------------------------------------------------------------------------
  # kind-registry — the FRESHNESS half of the one-type law. The generated kind
  # types are only "the only types" if they still match the live registry: a
  # kind whose schema changed while the artifact did not is a type that lies.
  #
  # This job used to `exit 0` with a `::warning` when the secret was absent —
  # "SKIPS LOUDLY rather than passing quietly". It did not skip loudly. Every
  # run since this file was written has reported
  #     generated kind types match the live registry: success
  # having checked NOTHING: SUPABASE_SECRET_KEY has never been configured for
  # this repo (verified against the run logs, 2026-08-24). A green tick that
  # names a claim it did not test is worse than a red one, and it is exactly
  # the "WARN that reads as a pass" THE STRICTNESS LAW clause 7 forbids.
  #
  # RESOLVED 2026-08-25: both repo secrets (SUPABASE_SECRET_KEY +
  # NEXT_PUBLIC_SUPABASE_URL) are configured and this job measures for real
  # (verified green against live runs, 2026-08-31). The UNMEASURED hard-fail
  # below STAYS — it is the guard that fires again if the secrets are ever
  # rotated away, and a gate that cannot reach its dependency must fail, never
  # warn (THE STRICTNESS LAW clause 7).
  # ---------------------------------------------------------------------------
  kind-registry:
    name: generated kind types vs the live registry (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    needs: secrets-preflight
    if: needs.secrets-preflight.outputs.supabase == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Reaching this step at all means secrets-preflight confirmed the
      # credentials exist; without them the whole job is SKIPPED and the
      # preflight stamps the UNMEASURED warning. No silent degradation.
      - name: Generated kind types vs content_ir.kind_definition
        run: pnpm check:kind-types

  # ---------------------------------------------------------------------------
  # hr-punch — the STRICT lane of the HR punch write-path conformance gate.
  # hr.punch is a `component` table, so RLS admits any parent-editor insert;
  # what actually holds the door is structural and live-only (hr absent from
  # PostgREST's exposed schemas, zero anon grants, an enumerated set of
  # sanctioned SECURITY DEFINER writers with pinned search_paths) — facts tsc
  # and code review cannot see. SPEC-TIME §15 named wiring that query into CI
  # as the only thing standing between us and a client-direct insert path.
  #
  # Until 2026-08-26 the `:strict` variant was invoked by NOTHING: release.sh
  # runs run-release-gates.sh `--advisory || true`, so the "blocking" gate
  # screamed and blocked nothing (HRB-015; same family as the component-
  # created-by gate that hid 229 violations behind a green [OK]). This job is
  # the strict lane. Credential-gated like kind-registry above, and for the
  # same reason it hard-fails as UNMEASURED when the secret is absent: the
  # checker treats an unreachable DB or an empty/short result as a finding,
  # never as a pass. Falsifiability proven 2026-08-26: a planted unsanctioned
  # inserter function made `--strict` exit 1 naming it; dropped, green again.
  # ---------------------------------------------------------------------------
  hr-punch:
    name: HR punch write path (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    needs: secrets-preflight
    if: needs.secrets-preflight.outputs.supabase == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Gated by secrets-preflight: absent credentials SKIP this job (grey,
      # with an UNMEASURED warning on the run) instead of turning it red on
      # every push for a reason no code change can fix.
      - name: No client-direct insert path into hr.punch
        run: pnpm check:hr-punch-write-path:strict

  # ---------------------------------------------------------------------------
  # hr-guards — five HR gates that existed and RAN NOWHERE. Every one of them was
  # written, proven falsifiable by its author, given a `pnpm` name or a jest file,
  # and then invoked by nothing: not this workflow, not run-release-gates.sh, not a
  # git hook (there are none — .git/hooks holds only .sample files). Audited
  # 2026-08-29; the greps are in the audit, and each is cited on its step below.
  #
  # This is the same class as HRB-015 and the component-created-by gate that hid
  # 229 violations behind a green [OK]: a gate nothing runs is not a weak gate, it
  # is a false belief that the property is protected. All five are STATIC or
  # MOCK-BACKED — no database, no secrets — so they are cheap enough to run on
  # every push and they cannot report UNMEASURED.
  #
  # Every step is `if: always()`, so one failure never hides the other three. A
  # masked second failure is how two regressions ship as one.
  # ---------------------------------------------------------------------------
  hr-guards:
    name: HR nav, URL, envelope and mock-walk guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every HR nav destination is a route that exists
        id: hr_nav
        # features/hr/__tests__/nav-destinations-exist.test.ts walks resolveHrNav
        # for all five personas and asserts the route file exists for every href.
        # A nav item pointing at a deleted route is a 404 the persona hits and the
        # author never sees — they tested their own persona. jest picks this file
        # up only in an unscoped `pnpm test`, which nothing runs; CI's two jest
        # jobs are scoped to features/content-ir and features/workflow-runtime.
        run: pnpm exec jest features/hr/__tests__/nav-destinations-exist.test.ts --no-coverage

      - name: No HR URL is hand-assembled in navigation position
        if: always() && steps.hr_nav.outcome != 'cancelled'
        # features/hr/__tests__/no-hand-built-hr-urls.test.ts. The canonical HR
        # route builders are the only sanctioned way to name an HR destination; a
        # hand-concatenated "/hr/..." literal in an href/router.push/redirect
        # survives every rename of the route it points at, silently. Same
        # orphaning as the nav test above — same fix.
        run: pnpm exec jest features/hr/__tests__/no-hand-built-hr-urls.test.ts --no-coverage

      - name: HR envelopes are validated, never cast
        if: always()
        # pnpm hr:envelope-check (scripts/hr/hrb022_envelope_check.ts). Referenced
        # in features/hr/tasks/FEATURE.md:88 as "Proof:" — prose telling a human to
        # run it, which is a hope, not a mechanism. Exits 1 on any failure; nothing
        # was reading that exit code.
        run: pnpm hr:envelope-check

      - name: HR mock walk — every operation serves all four cases
        if: always()
        # pnpm hr:mock-walk (scripts/hr/hrb012_mock_walk.ts, NEXT_PUBLIC_HR_MOCK=1,
        # fixtures on disk). 383 assertions over 60 operations. Its only reference
        # anywhere was a usage comment in its own header.
        run: pnpm hr:mock-walk

      - name: HR exports — four cases, and no download for a superseded row
        if: always()
        # pnpm hr:exports-cases (scripts/hr/hrb025_exports_four_cases.ts). Same
        # story: self-referencing usage comment, no caller.
        run: pnpm hr:exports-cases

      - name: HR RPC conformance — every door call matches the door it calls
        if: always()
        # pnpm hr:rpc-conformance (scripts/hr/hrb026_rpc_conformance.ts). The HR
        # client↔Postgres seam is untyped in BOTH directions that matter: the
        # argument names and the jsonb payload KEYS. Every call site casts
        # (`fn as never`, `args as never`) because the generated types cannot
        # express these doors, so TypeScript checks nothing here. A misnamed
        # argument 400s and gets swallowed by the "a refusal is DATA" transport;
        # a misnamed payload key is a completely SILENT no-op that returns
        # ok:true and drops the field. That has now shipped at least five times
        # (verification letters, separations, corrective actions twice, the
        # corrective-action outcome args), which is the definition of a defect
        # class that needs a mechanism rather than another careful reviewer.
        #
        # STATIC, like every step above it: it diffs call sites against
        # scripts/hr/hr-door-snapshot.json, a committed pull of live pg_proc
        # (refresh: pnpm hr:door-snapshot). No database, no secrets, so it runs
        # on every push and can never report UNMEASURED — the same doctrine as
        # scripts/schema-check's committed snapshot.
        #
        # It prints an UNANALYZABLE list on every run naming each call site it
        # could not fully resolve and why. Those are NOT passes; read them.
        run: pnpm hr:rpc-conformance

  # ---------------------------------------------------------------------------
  # migration-slot-guard — liveness for the BEFORE INSERT ROW trigger on
  # public._schema_migrations (migrations/migration_slot_guard.sql), installed
  # 2026-08-29 after FOUR migration-number collisions in two days. That guard
  # shipped with no liveness assertion at all: dropped, disabled, or moved to
  # AFTER, and the collisions resume in silence while the next agent reads the
  # guard's .sql file and believes it is protected.
  #
  # It could not join `check:db-guards` — that checker reads pg_event_trigger
  # filtered to schema `platform`, where a row trigger in `public` can never
  # appear, so listing it there would report it permanently MISSING. It could not
  # join `check:migrations` either: that one exits 1 in --strict today over a real
  # backlog (one unapplied migration, 88 drifted files), so a liveness assertion
  # bolted onto it could never be wired here. Hence a small dedicated check, with
  # zero backlog by construction — the guard is bound or it is not.
  #
  # Credential-gated like kind-registry and hr-punch, and UNMEASURED is a hard
  # fail for the same reason: a gate that cannot reach its dependency fails, it
  # does not degrade into a warning that reads as a pass.
  #
  # Falsifiability proven 2026-08-29, red then green: inside a rolled-back
  # transaction, disabling the trigger turned slot_guard_trigger_installed false,
  # dropping public.migration_slot(text) turned slot_rule_function_present false,
  # and dropping the grandfather table turned slot_guard_baseline_present false;
  # the rollback restored all three. Separately, a temporarily sabotaged reporting
  # function made `--strict` exit 1 and the advisory lane exit 0.
  # ---------------------------------------------------------------------------
  migration-slot-guard:
    name: migration slot guard is live (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    needs: secrets-preflight
    if: needs.secrets-preflight.outputs.supabase == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Gated by secrets-preflight (see that job): absent credentials SKIP,
      # they never pass.
      - name: The migration numeric-slot trigger is bound and enabled
        run: pnpm check:migration-slot-guard:strict

  # ---------------------------------------------------------------------------
  # soft-delete-cascade — liveness for platform.soft_delete_edge and the two
  # generic triggers that read it (migrations/platform_soft_delete_cascade.sql,
  # 2026-09-08). Removing a mandate used to leave every row hanging off it LIVE:
  # four campaign lanes each removed a scratch job through the UI, re-read, saw it
  # gone, and each left bindings and treatments behind. Measured RED on production
  # before the fix — 1 binding, 1 treatment, 1 exemplar, 1 note still live, and
  # attaching a NEW part to an already-removed job accepted.
  #
  # Credential-gated, and UNMEASURED is a hard fail, for the same reason as the
  # job above: a gate that cannot reach its dependency fails, it does not degrade
  # into a warning that reads as a pass.
  #
  # Falsifiability proven 2026-09-08 on the live database: disabling
  # `_cascade_softdelete` on mandate.definition and `_guard_soft_delete_parent` on
  # mandate.binding turned cascade_trigger_installed and child_guard_installed
  # false, naming both relations; re-enabling them turned all five checks green.
  # ---------------------------------------------------------------------------
  soft-delete-cascade:
    name: removing a thing still removes its parts (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    needs: secrets-preflight
    if: needs.secrets-preflight.outputs.supabase == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Gated by secrets-preflight (see that job): absent credentials SKIP,
      # they never pass. When the credentials ARE present and the live RPC
      # errors, --strict still fails red — that is a real finding about the
      # cascade being unmeasurable, not a missing-secret artefact.
      - name: Soft-deleting a parent still removes everything declared part of it
        run: pnpm check:soft-delete-cascade:strict

  # ---------------------------------------------------------------------------
  # realtime-publication — a `postgres_changes` binding on a table that is NOT in
  # the `supabase_realtime` publication joins, reports SUBSCRIBED, and delivers
  # nothing, forever, with no error anywhere. That has shipped FOUR times:
  # `workbench.notes` (2026-07-10, real user data lost), `tool.ui` +
  # `app.definition`, `users.user_memory` + `iam.permissions`, and all six
  # `communication.meet_*` tables (Meet was silent from launch until MRI-A10 on
  # 2026-09-08). Publication membership is not granted by
  # `platform.create_entity_table` — it is a separate, forgettable migration.
  #
  # NOT A GREP. MRI-A10's census found `schema:`/`table:` are usually indirect
  # (`repository.tables.notes`, `adapter.realtimeTable`, a `scoped()` spread), so
  # a regex scanner reports GREEN over exactly the shape that keeps failing. This
  # is a TypeScript-AST resolver, and anything it cannot resolve statically FAILS
  # as UNRESOLVED rather than being skipped.
  #
  # TWO dependencies, and BOTH are hard-fail-if-absent (THE STRICTNESS LAW clause
  # 7): the live `pg_publication_tables` read (credential-gated, like
  # kind-registry / hr-punch / migration-slot-guard above) and the sibling
  # aidream checkout, because the @ai-matrx packages hold real bindings —
  # @ai-matrx/meet's `watchMeeting` is where the fourth instance lived. Scanning
  # only this repo and reporting green would be the defect wearing a tick. The
  # checkout mirrors aidream's own `kinds-parity` job (test.yml pulls this repo
  # the same way), sparse to `apps/shared`.
  #
  # Falsifiability: `pnpm check:realtime-publication:self-test` plants an
  # unpublished subscription AND an unresolvable one and proves both are caught;
  # it runs here in the same job, before the real check.
  # ---------------------------------------------------------------------------
  realtime-publication:
    name: subscribed tables are in supabase_realtime (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    # Two credentials, both required: SUPABASE_* to read pg_publication_tables,
    # and AIDREAM_REPO_TOKEN to reach the other half of the census. This repo is
    # armanisadeghi/ai-matrx; aidream lives in AI-Matrix-Engine/aidream, a
    # different owner, so the workflow's own GITHUB_TOKEN cannot see it and the
    # checkout below answered `Not Found` on every run this job ever had. Absent
    # either credential the job SKIPS with an UNMEASURED warning from
    # secrets-preflight — it never reports success.
    needs: secrets-preflight
    if: needs.secrets-preflight.outputs.supabase == 'true' && needs.secrets-preflight.outputs.aidream_repo == 'true'
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      AIDREAM_DIR: ${{ github.workspace }}/aidream
    steps:
      - uses: actions/checkout@v4
      - name: Check out aidream's shared packages (the other half of the census)
        uses: actions/checkout@v4
        with:
          repository: AI-Matrix-Engine/aidream
          path: aidream
          token: ${{ secrets.AIDREAM_REPO_TOKEN }}
          sparse-checkout: apps/shared
          sparse-checkout-cone-mode: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: The guard can still fail (planted unpublished + planted unresolvable)
        run: pnpm check:realtime-publication:self-test
      - name: Every subscribed table is in the supabase_realtime publication
        run: pnpm check:realtime-publication

  # ---------------------------------------------------------------------------
  # type-check — `next.config.js` sets `ignoreBuildErrors: true`, so a green
  # build proves NOTHING about types and Vercel will happily deploy a repo full
  # of type errors. `pnpm type-check` is the only type gate this repo has.
  # ---------------------------------------------------------------------------
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        # Matches the ceiling `pnpm dev` uses; tsc over this repo outgrew the
        # default heap once already.
        run: NODE_OPTIONS='--max-old-space-size=6144' pnpm type-check

  # ---------------------------------------------------------------------------
  # organization-context — every migrated first-party API call must fail before
  # auth lookup/network I/O unless one explicit organization UUID is present.
  # ---------------------------------------------------------------------------
  organization-context:
    name: ORGANIZATION CONTEXT (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse org-less or mismatched API transport
        run: pnpm check:organization-context

  # ---------------------------------------------------------------------------
  # suites — the two feature suites that pin cross-repo contracts, so a change
  # here can break a producer in aidream (and vice versa):
  #   content-ir      the kind registry, block dispatch, the partial-kind wire
  #                   reader whose fixture aidream generates, AND the Kind
  #                   Directives grammar-parity test — the client mirror of
  #                   aidream's directives.py asserted against the committed
  #                   docs/protocol/kind_directive_grammar.generated.json, so
  #                   the parity claim is measurable HERE, where there is no
  #                   aidream checkout. (`pnpm check:directive-grammar` is the
  #                   other half and runs where aidream exists.)
  #   workflow-runtime the run surface that renders those kinds live
  # Both run even if the other fails — a masked second failure is how two
  # regressions ship as one.
  # ---------------------------------------------------------------------------
  suites:
    name: content-ir + workflow-runtime suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content IR / kinds suite
        id: content_ir
        run: pnpm test:content-ir

      - name: Workflow runtime suite
        # `always()` so a content-IR failure never hides a workflow-runtime one.
        if: always() && steps.content_ir.outcome != 'cancelled'
        run: pnpm test:workflow-runtime

      - name: Administration navigation cannot lose a route
        # features/admin/components/AdminRouteSidebarMenu.test.tsx asserts every
        # registry destination and every domain landing is reachable from the
        # rendered sidebar, that no href renders twice, and that only one
        # .shell-active-pill is live at a time (two share a static
        # view-transition-name and kill the nav transition).
        #
        # check:admin-catalog compares the registry to the FILESYSTEM and is
        # happy whether or not the menu renders what it declares, so it cannot
        # catch a destination vanishing from the sidebar. Run both: the catalog
        # check owns "the route exists", this owns "you can get to it".
        #
        # Neither ran in CI before 2026-09-08. Like the HR guards above, jest
        # picks this file up only in an unscoped `pnpm test`, which nothing runs.
        if: always() && steps.content_ir.outcome != 'cancelled'
        run: pnpm test:admin-nav

      - name: Administration route registry matches the filesystem
        if: always() && steps.content_ir.outcome != 'cancelled'
        run: pnpm check:admin-catalog:strict
