name: CI

# Per-PR checks. Until this file existed, every gate in this repo lived inside
# `scripts/run-release-gates.sh` — which runs at RELEASE time, by hand. A
# regression to the `__kind` marker law, the type surface, or the content-IR /
# workflow-runtime contracts could therefore sit on `main` undetected until
# somebody happened to cut a release. This closes that window.
#
# SCOPE, deliberately: this is NOT the release gate. It runs the few checks
# that must never regress silently and that are cheap enough to run on every
# push. The full gate (migrations, schema drift, access matrices, the ~40 other
# `check:*` scripts) stays where it belongs — in `run-release-gates.sh`, owned
# by `./ship.sh`. Adding a slow check here trains people to ignore a red X.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # marker-law — the cheapest and most load-bearing gate in the repo. `__kind`
  # is part of the data (KINDS_EVERYWHERE_PLAN §4.2); stripping it outside the
  # three lawful doors is what made the workflow engine validate against shapes
  # its own renderers could not identify. Pure static scan, ~1s, and it needs
  # nothing installed beyond tsx — so it gets its own job and reports first.
  # aidream runs the same law as its own step in `.github/workflows/test.yml`;
  # a kind crosses both repos, so both halves must be guarded.
  # ---------------------------------------------------------------------------
  marker-law:
    name: the __kind marker law
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: THE `__kind` MARKER LAW — no stripping outside the lawful doors
        run: pnpm check:kind-marker-law
      - name: THE ONE-TYPE LAW — no hand-written twin of a registered kind
        # A kind's shape is written down ONCE, in the generated artifact
        # (`pnpm shape:types`). A hand-written interface beside a bridge or a
        # renderer is a second source of truth that drifts silently and shows
        # up as a blank field on a user's screen, never as a compile error.
        # Offline: it reads the committed artifact, not the registry — the
        # registry-freshness half runs in the `kind-registry` job below, which
        # needs credentials. KINDS_EVERYWHERE_PLAN §10g GAP 1.
        run: pnpm check:kind-type-twins
      - name: CLAUDE.md's machine-checkable claims still hold
        # Includes the claim that THIS workflow runs the gates named in it.
        # Without it here, deleting a step from this file would silently make
        # CLAUDE.md promise a gate that no longer runs — and an agent that
        # trusts the promise skips its own verification.
        run: pnpm check:doc-claims --strict

  # ---------------------------------------------------------------------------
  # kind-registry — the FRESHNESS half of the one-type law. The generated kind
  # types are only "the only types" if they still match the live registry: a
  # kind whose schema changed while the artifact did not is a type that lies.
  #
  # This job used to `exit 0` with a `::warning` when the secret was absent —
  # "SKIPS LOUDLY rather than passing quietly". It did not skip loudly. Every
  # run since this file was written has reported
  #     generated kind types match the live registry: success
  # having checked NOTHING: SUPABASE_SECRET_KEY has never been configured for
  # this repo (verified against the run logs, 2026-08-24). A green tick that
  # names a claim it did not test is worse than a red one, and it is exactly
  # the "WARN that reads as a pass" THE STRICTNESS LAW clause 7 forbids.
  #
  # 🚨 ARMAN: the fix is ONE repo secret — SUPABASE_SECRET_KEY (plus
  # NEXT_PUBLIC_SUPABASE_URL). Until it exists this job is RED, deliberately,
  # because the alternative is a gate that lies on every push.
  # ---------------------------------------------------------------------------
  kind-registry:
    name: generated kind types vs the live registry (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated kind types vs content_ir.kind_definition
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error title=UNMEASURED — kind registry freshness was NOT verified::SUPABASE_SECRET_KEY is not configured for this repo, so pnpm check:kind-types could not run and the generated kind types may be stale against the live registry. This job reports UNMEASURED, never success: a gate that cannot reach its dependency fails, it does not degrade to a warning that reads as a pass (THE STRICTNESS LAW clause 7). Fix: add the SUPABASE_SECRET_KEY and NEXT_PUBLIC_SUPABASE_URL repo secrets."
            exit 2
          fi
          pnpm check:kind-types

  # ---------------------------------------------------------------------------
  # type-check — `next.config.js` sets `ignoreBuildErrors: true`, so a green
  # build proves NOTHING about types and Vercel will happily deploy a repo full
  # of type errors. `pnpm type-check` is the only type gate this repo has.
  # ---------------------------------------------------------------------------
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        # Matches the ceiling `pnpm dev` uses; tsc over this repo outgrew the
        # default heap once already.
        run: NODE_OPTIONS='--max-old-space-size=6144' pnpm type-check

  # ---------------------------------------------------------------------------
  # organization-context — every migrated first-party API call must fail before
  # auth lookup/network I/O unless one explicit organization UUID is present.
  # ---------------------------------------------------------------------------
  organization-context:
    name: ORGANIZATION CONTEXT (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse org-less or mismatched API transport
        run: pnpm check:organization-context

  # ---------------------------------------------------------------------------
  # suites — the two feature suites that pin cross-repo contracts, so a change
  # here can break a producer in aidream (and vice versa):
  #   content-ir      the kind registry, block dispatch, the partial-kind wire
  #                   reader whose fixture aidream generates
  #   workflow-runtime the run surface that renders those kinds live
  # Both run even if the other fails — a masked second failure is how two
  # regressions ship as one.
  # ---------------------------------------------------------------------------
  suites:
    name: content-ir + workflow-runtime suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content IR / kinds suite
        id: content_ir
        run: pnpm test:content-ir

      - name: Workflow runtime suite
        # `always()` so a content-IR failure never hides a workflow-runtime one.
        if: always() && steps.content_ir.outcome != 'cancelled'
        run: pnpm test:workflow-runtime
