name: CI

# Per-PR checks. Until this file existed, every gate in this repo lived inside
# `scripts/run-release-gates.sh` — which runs at RELEASE time, by hand. A
# regression to the `__kind` marker law, the type surface, or the content-IR /
# workflow-runtime contracts could therefore sit on `main` undetected until
# somebody happened to cut a release. This closes that window.
#
# SCOPE, deliberately: this is NOT the release gate. It runs the few checks
# that must never regress silently and that are cheap enough to run on every
# push. The full gate (migrations, schema drift, access matrices, the ~40 other
# `check:*` scripts) stays where it belongs — in `run-release-gates.sh`, owned
# by `./ship.sh`. Adding a slow check here trains people to ignore a red X.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # marker-law — the cheapest and most load-bearing gate in the repo. `__kind`
  # is part of the data (KINDS_EVERYWHERE_PLAN §4.2); stripping it outside the
  # three lawful doors is what made the workflow engine validate against shapes
  # its own renderers could not identify. Pure static scan, ~1s, and it needs
  # nothing installed beyond tsx — so it gets its own job and reports first.
  # aidream runs the same law as its own step in `.github/workflows/test.yml`;
  # a kind crosses both repos, so both halves must be guarded.
  # ---------------------------------------------------------------------------
  marker-law:
    name: the __kind marker law
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Matrx-owned packages are declared and installed at npm latest
        run: pnpm check:matrx-packages
      - name: THE `__kind` MARKER LAW — no stripping outside the lawful doors
        run: pnpm check:kind-marker-law
      - name: THE ONE-TYPE LAW — no hand-written twin of a registered kind
        # A kind's shape is written down ONCE, in the generated artifact
        # (`pnpm shape:types`). A hand-written interface beside a bridge or a
        # renderer is a second source of truth that drifts silently and shows
        # up as a blank field on a user's screen, never as a compile error.
        # Offline: it reads the committed artifact, not the registry — the
        # registry-freshness half runs in the `kind-registry` job below, which
        # needs credentials. KINDS_EVERYWHERE_PLAN §10g GAP 1.
        run: pnpm check:kind-type-twins
      - name: THE KIND DIRECTIVES SHIM stays contained
        # `directives/legacyShell.ts` translates stored 4-key ```matrx fences so
        # old conversations keep rendering. It is the campaign's ONE legacy
        # surface and it has exactly one importer. The moment a second module
        # imports it, "translate what we stored" quietly becomes "accept the old
        # shape anywhere" and the retired shell is a live protocol again.
        # PLAN.md § THE STRICTNESS LAW clause 4.
        run: pnpm check:legacy-shim-containment
      - name: CLAUDE.md's machine-checkable claims still hold
        # Includes the claim that THIS workflow runs the gates named in it.
        # Without it here, deleting a step from this file would silently make
        # CLAUDE.md promise a gate that no longer runs — and an agent that
        # trusts the promise skips its own verification.
        run: pnpm check:doc-claims --strict

  # ---------------------------------------------------------------------------
  # kind-registry — the FRESHNESS half of the one-type law. The generated kind
  # types are only "the only types" if they still match the live registry: a
  # kind whose schema changed while the artifact did not is a type that lies.
  #
  # This job used to `exit 0` with a `::warning` when the secret was absent —
  # "SKIPS LOUDLY rather than passing quietly". It did not skip loudly. Every
  # run since this file was written has reported
  #     generated kind types match the live registry: success
  # having checked NOTHING: SUPABASE_SECRET_KEY has never been configured for
  # this repo (verified against the run logs, 2026-08-24). A green tick that
  # names a claim it did not test is worse than a red one, and it is exactly
  # the "WARN that reads as a pass" THE STRICTNESS LAW clause 7 forbids.
  #
  # 🚨 ARMAN: the fix is ONE repo secret — SUPABASE_SECRET_KEY (plus
  # NEXT_PUBLIC_SUPABASE_URL). Until it exists this job is RED, deliberately,
  # because the alternative is a gate that lies on every push.
  # ---------------------------------------------------------------------------
  kind-registry:
    name: generated kind types vs the live registry (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generated kind types vs content_ir.kind_definition
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error title=UNMEASURED — kind registry freshness was NOT verified::SUPABASE_SECRET_KEY is not configured for this repo, so pnpm check:kind-types could not run and the generated kind types may be stale against the live registry. This job reports UNMEASURED, never success: a gate that cannot reach its dependency fails, it does not degrade to a warning that reads as a pass (THE STRICTNESS LAW clause 7). Fix: add the SUPABASE_SECRET_KEY and NEXT_PUBLIC_SUPABASE_URL repo secrets."
            exit 2
          fi
          pnpm check:kind-types

  # ---------------------------------------------------------------------------
  # hr-punch — the STRICT lane of the HR punch write-path conformance gate.
  # hr.punch is a `component` table, so RLS admits any parent-editor insert;
  # what actually holds the door is structural and live-only (hr absent from
  # PostgREST's exposed schemas, zero anon grants, an enumerated set of
  # sanctioned SECURITY DEFINER writers with pinned search_paths) — facts tsc
  # and code review cannot see. SPEC-TIME §15 named wiring that query into CI
  # as the only thing standing between us and a client-direct insert path.
  #
  # Until 2026-08-26 the `:strict` variant was invoked by NOTHING: release.sh
  # runs run-release-gates.sh `--advisory || true`, so the "blocking" gate
  # screamed and blocked nothing (HRB-015; same family as the component-
  # created-by gate that hid 229 violations behind a green [OK]). This job is
  # the strict lane. Credential-gated like kind-registry above, and for the
  # same reason it hard-fails as UNMEASURED when the secret is absent: the
  # checker treats an unreachable DB or an empty/short result as a finding,
  # never as a pass. Falsifiability proven 2026-08-26: a planted unsanctioned
  # inserter function made `--strict` exit 1 naming it; dropped, green again.
  # ---------------------------------------------------------------------------
  hr-punch:
    name: HR punch write path (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: No client-direct insert path into hr.punch
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error title=UNMEASURED — the hr.punch write path was NOT verified::SUPABASE_SECRET_KEY is not configured for this repo, so pnpm check:hr-punch-write-path:strict could not run and a client-direct insert path into hr.punch may exist unnoticed. This job reports UNMEASURED, never success: a gate that cannot reach its dependency fails, it does not degrade to a warning that reads as a pass (THE STRICTNESS LAW clause 7). Fix: add the SUPABASE_SECRET_KEY and NEXT_PUBLIC_SUPABASE_URL repo secrets."
            exit 2
          fi
          pnpm check:hr-punch-write-path:strict

  # ---------------------------------------------------------------------------
  # hr-guards — five HR gates that existed and RAN NOWHERE. Every one of them was
  # written, proven falsifiable by its author, given a `pnpm` name or a jest file,
  # and then invoked by nothing: not this workflow, not run-release-gates.sh, not a
  # git hook (there are none — .git/hooks holds only .sample files). Audited
  # 2026-08-29; the greps are in the audit, and each is cited on its step below.
  #
  # This is the same class as HRB-015 and the component-created-by gate that hid
  # 229 violations behind a green [OK]: a gate nothing runs is not a weak gate, it
  # is a false belief that the property is protected. All five are STATIC or
  # MOCK-BACKED — no database, no secrets — so they are cheap enough to run on
  # every push and they cannot report UNMEASURED.
  #
  # Every step is `if: always()`, so one failure never hides the other three. A
  # masked second failure is how two regressions ship as one.
  # ---------------------------------------------------------------------------
  hr-guards:
    name: HR nav, URL, envelope and mock-walk guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every HR nav destination is a route that exists
        id: hr_nav
        # features/hr/__tests__/nav-destinations-exist.test.ts walks resolveHrNav
        # for all five personas and asserts the route file exists for every href.
        # A nav item pointing at a deleted route is a 404 the persona hits and the
        # author never sees — they tested their own persona. jest picks this file
        # up only in an unscoped `pnpm test`, which nothing runs; CI's two jest
        # jobs are scoped to features/content-ir and features/workflow-runtime.
        run: pnpm exec jest features/hr/__tests__/nav-destinations-exist.test.ts --no-coverage

      - name: No HR URL is hand-assembled in navigation position
        if: always() && steps.hr_nav.outcome != 'cancelled'
        # features/hr/__tests__/no-hand-built-hr-urls.test.ts. The canonical HR
        # route builders are the only sanctioned way to name an HR destination; a
        # hand-concatenated "/hr/..." literal in an href/router.push/redirect
        # survives every rename of the route it points at, silently. Same
        # orphaning as the nav test above — same fix.
        run: pnpm exec jest features/hr/__tests__/no-hand-built-hr-urls.test.ts --no-coverage

      - name: HR envelopes are validated, never cast
        if: always()
        # pnpm hr:envelope-check (scripts/hr/hrb022_envelope_check.ts). Referenced
        # in features/hr/tasks/FEATURE.md:88 as "Proof:" — prose telling a human to
        # run it, which is a hope, not a mechanism. Exits 1 on any failure; nothing
        # was reading that exit code.
        run: pnpm hr:envelope-check

      - name: HR mock walk — every operation serves all four cases
        if: always()
        # pnpm hr:mock-walk (scripts/hr/hrb012_mock_walk.ts, NEXT_PUBLIC_HR_MOCK=1,
        # fixtures on disk). 383 assertions over 60 operations. Its only reference
        # anywhere was a usage comment in its own header.
        run: echo SABOTAGE-job-deleted

      - name: HR exports — four cases, and no download for a superseded row
        if: always()
        # pnpm hr:exports-cases (scripts/hr/hrb025_exports_four_cases.ts). Same
        # story: self-referencing usage comment, no caller.
        run: pnpm hr:exports-cases

  # ---------------------------------------------------------------------------
  # migration-slot-guard — liveness for the BEFORE INSERT ROW trigger on
  # public._schema_migrations (migrations/migration_slot_guard.sql), installed
  # 2026-08-29 after FOUR migration-number collisions in two days. That guard
  # shipped with no liveness assertion at all: dropped, disabled, or moved to
  # AFTER, and the collisions resume in silence while the next agent reads the
  # guard's .sql file and believes it is protected.
  #
  # It could not join `check:db-guards` — that checker reads pg_event_trigger
  # filtered to schema `platform`, where a row trigger in `public` can never
  # appear, so listing it there would report it permanently MISSING. It could not
  # join `check:migrations` either: that one exits 1 in --strict today over a real
  # backlog (one unapplied migration, 88 drifted files), so a liveness assertion
  # bolted onto it could never be wired here. Hence a small dedicated check, with
  # zero backlog by construction — the guard is bound or it is not.
  #
  # Credential-gated like kind-registry and hr-punch, and UNMEASURED is a hard
  # fail for the same reason: a gate that cannot reach its dependency fails, it
  # does not degrade into a warning that reads as a pass.
  #
  # Falsifiability proven 2026-08-29, red then green: inside a rolled-back
  # transaction, disabling the trigger turned slot_guard_trigger_installed false,
  # dropping public.migration_slot(text) turned slot_rule_function_present false,
  # and dropping the grandfather table turned slot_guard_baseline_present false;
  # the rollback restored all three. Separately, a temporarily sabotaged reporting
  # function made `--strict` exit 1 and the advisory lane exit 0.
  # ---------------------------------------------------------------------------
  migration-slot-guard:
    name: migration slot guard is live (UNMEASURED without the secret)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: The migration numeric-slot trigger is bound and enabled
        run: |
          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error title=UNMEASURED — the migration slot guard was NOT verified::SUPABASE_SECRET_KEY is not configured for this repo, so pnpm check:migration-slot-guard:strict could not run and the BEFORE INSERT trigger on public._schema_migrations may be dropped or disabled without anything noticing. This job reports UNMEASURED, never success: a gate that cannot reach its dependency fails, it does not degrade to a warning that reads as a pass (THE STRICTNESS LAW clause 7). Fix: add the SUPABASE_SECRET_KEY and NEXT_PUBLIC_SUPABASE_URL repo secrets."
            exit 2
          fi
          echo SABOTAGE-slot-job-deleted

  # ---------------------------------------------------------------------------
  # type-check — `next.config.js` sets `ignoreBuildErrors: true`, so a green
  # build proves NOTHING about types and Vercel will happily deploy a repo full
  # of type errors. `pnpm type-check` is the only type gate this repo has.
  # ---------------------------------------------------------------------------
  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript type-check
        # Matches the ceiling `pnpm dev` uses; tsc over this repo outgrew the
        # default heap once already.
        run: NODE_OPTIONS='--max-old-space-size=6144' pnpm type-check

  # ---------------------------------------------------------------------------
  # organization-context — every migrated first-party API call must fail before
  # auth lookup/network I/O unless one explicit organization UUID is present.
  # ---------------------------------------------------------------------------
  organization-context:
    name: ORGANIZATION CONTEXT (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Refuse org-less or mismatched API transport
        run: pnpm check:organization-context

  # ---------------------------------------------------------------------------
  # suites — the two feature suites that pin cross-repo contracts, so a change
  # here can break a producer in aidream (and vice versa):
  #   content-ir      the kind registry, block dispatch, the partial-kind wire
  #                   reader whose fixture aidream generates, AND the Kind
  #                   Directives grammar-parity test — the client mirror of
  #                   aidream's directives.py asserted against the committed
  #                   docs/protocol/kind_directive_grammar.generated.json, so
  #                   the parity claim is measurable HERE, where there is no
  #                   aidream checkout. (`pnpm check:directive-grammar` is the
  #                   other half and runs where aidream exists.)
  #   workflow-runtime the run surface that renders those kinds live
  # Both run even if the other fails — a masked second failure is how two
  # regressions ship as one.
  # ---------------------------------------------------------------------------
  suites:
    name: content-ir + workflow-runtime suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Content IR / kinds suite
        id: content_ir
        run: pnpm test:content-ir

      - name: Workflow runtime suite
        # `always()` so a content-IR failure never hides a workflow-runtime one.
        if: always() && steps.content_ir.outcome != 'cancelled'
        run: pnpm test:workflow-runtime
